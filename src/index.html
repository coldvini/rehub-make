<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas class="ambient" id="ambient" width="64" height="40" aria-hidden="true"></canvas>

  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>Lumen</span>
    </div>
    <div class="title-actions">
      <button class="ghost-btn" id="openGallery" title="Gallery  (G)">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        <span>Gallery</span>
        <span class="badge" id="galleryCount">0</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <!-- ───────────── Canvas stage ───────────── -->
    <section class="stage" id="stage">
      <div class="frame-wrap" id="frameWrap">
        <div class="frame-glow" aria-hidden="true"></div>
        <div class="frame" id="frame">
          <canvas id="art"></canvas>
          <div class="flash" id="flash"></div>
          <div class="frame-meta">
            <span id="metaStyle">Mesh</span>
            <span class="sep"></span>
            <span id="metaSeed">#000000</span>
            <span class="sep"></span>
            <span id="metaRes">—</span>
          </div>
        </div>
      </div>

      <div class="actionbar">
        <button class="pill-btn shuffle" id="shuffleBtn" title="New artwork  (Space)">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" class="dot"/><circle cx="15.5" cy="15.5" r="1.3" class="dot"/><circle cx="12" cy="12" r="1.3" class="dot"/><circle cx="15.5" cy="8.5" r="1.3" class="dot"/><circle cx="8.5" cy="15.5" r="1.3" class="dot"/></svg>
          <span>Shuffle</span>
          <kbd>Space</kbd>
        </button>
        <button class="round-btn" id="animateBtn" title="Live motion  (A)" aria-pressed="true">
          <svg class="i-on" viewBox="0 0 24 24"><rect x="7" y="5.5" width="3.5" height="13" rx="1.2"/><rect x="13.5" y="5.5" width="3.5" height="13" rx="1.2"/></svg>
          <svg class="i-off" viewBox="0 0 24 24"><path d="M8 5.8v12.4a1 1 0 0 0 1.5.86l10-6.2a1 1 0 0 0 0-1.7l-10-6.2A1 1 0 0 0 8 5.8Z"/></svg>
        </button>
        <button class="round-btn" id="favBtn" title="Save to gallery  (F)">
          <svg viewBox="0 0 24 24"><path d="M12 20.3s-7.5-4.6-7.5-10.1A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1Z"/></svg>
        </button>
        <button class="round-btn" id="exportBtn" title="Export PNG  (Ctrl/⌘ S)">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>
        </button>
        <button class="primary-btn" id="wallpaperBtn" title="Set as desktop wallpaper  (W)">
          <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 20.5h7M12 17v3.5"/><path d="m6.5 14 3.5-4 2.5 2.7L14.5 10l3 4" /></svg>
          <span>Set as wallpaper</span>
        </button>
      </div>
    </section>

    <!-- ───────────── Controls ───────────── -->
    <aside class="panel">
      <div class="section">
        <div class="section-head"><h3>Style</h3><span class="hint">1 – 6</span></div>
        <div class="styles" id="styles"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <h3>Colours</h3>
          <button class="link-btn" id="randomPalette" title="Random colours  (C)">
            <svg viewBox="0 0 24 24"><path d="M4 7h3.5c4 0 5 10 9 10H20M17 14l3 3-3 3M4 17h3.5c1.6 0 2.7-1.6 3.6-3.5M13 9.5C13.9 8 15 7 16.5 7H20M17 4l3 3-3 3"/></svg>
            Surprise me
          </button>
        </div>
        <div class="palettes" id="palettes"></div>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="section">
        <div class="section-head"><h3>Tweak</h3><button class="link-btn" id="resetTweaks">Reset</button></div>
        <label class="slider"><span>Detail</span><input type="range" min="0" max="1" step="0.01" data-param="complexity" /></label>
        <label class="slider"><span>Glow</span><input type="range" min="0" max="1" step="0.01" data-param="glow" /></label>
        <label class="slider"><span>Scale</span><input type="range" min="0" max="1" step="0.01" data-param="scale" /></label>
        <label class="slider"><span>Film grain</span><input type="range" min="0" max="1" step="0.01" data-param="grain" /></label>
      </div>

      <div class="section seed-row">
        <div>
          <h3>Seed</h3>
          <span class="seed" id="seedText">#000000</span>
        </div>
        <button class="ghost-btn small" id="copySeed" title="Copy seed">
          <svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg>
          Copy
        </button>
      </div>
    </aside>
  </main>

  <!-- ───────────── Gallery ───────────── -->
  <div class="sheet-backdrop" id="gallery" aria-hidden="true">
    <div class="sheet" role="dialog" aria-label="Gallery">
      <div class="sheet-head">
        <div>
          <h2>Your gallery</h2>
          <p class="sub">Every piece re-renders in full resolution, any time.</p>
        </div>
        <button class="ghost-btn icon" id="closeGallery" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
      <div class="gallery-empty" id="galleryEmpty">
        <div class="empty-art"></div>
        <p>Nothing saved yet</p>
        <span>Tap the heart on any artwork you love.</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><span class="toast-dot"></span><span id="toastText"></span></div>

  <script src="generators.js"></script>
  <script src="app.js"></script>
</body>
</html>
